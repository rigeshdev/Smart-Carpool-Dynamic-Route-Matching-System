            )}

            {page === 'profile' && (
              <div className="max-w-3xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-xs space-y-6">
                <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                  <div className="flex items-center gap-4">
                    <img src={currentUser.avatar} className="w-16 h-16 rounded-2xl object-cover ring-2 ring-indigo-500/30" />
                    <div>
                      <h2 className="text-xl font-black text-slate-900">{currentUser.name}</h2>
                      <p className="text-xs text-slate-500">{currentUser.department} • {currentUser.batch}</p>
                      <p className="text-xs text-indigo-600 font-bold">Roll ID: {currentUser.collegeId} • Role: {currentUser.role.toUpperCase()}</p>
                    </div>
                  </div>
                  <button onClick={() => showToast('Profile details updated!')} className="px-3.5 py-1.5 border border-slate-200 rounded-xl text-xs font-bold hover:bg-slate-50">
                    Edit Profile
                  </button>
                </div>

                <div className="grid grid-cols-3 gap-2 text-center text-xs p-3 bg-slate-50 rounded-2xl">
                  <div><strong>★ {currentUser.rating}</strong><span className="block text-[10px] text-slate-400">Rating</span></div>
                  <div><strong>{currentUser.totalTrips}</strong><span className="block text-[10px] text-slate-400">Total Trips</span></div>
                  <div><strong>{currentUser.savedCo2}</strong><span className="block text-[10px] text-slate-400">CO2 Saved</span></div>
                </div>

                {currentUser.vehicle && (
                  <div className="p-4 rounded-2xl bg-indigo-50 border border-indigo-100 text-xs space-y-1">
                    <span className="font-bold text-indigo-900 block text-sm">Registered Vehicle</span>
                    <p className="text-slate-700">Model: <strong>{currentUser.vehicle.model}</strong></p>
                    <p className="text-slate-700">License: <strong>{currentUser.vehicle.licensePlate}</strong></p>
                    <p className="text-slate-700">Capacity: <strong>{currentUser.vehicle.totalSeats} seats</strong></p>
                  </div>
                )}

                {/* Switcher */}
                <div className="pt-4 border-t border-slate-100">
                  <span className="text-[11px] font-bold text-slate-400 uppercase block mb-3">Switch Test Perspective (Evaluator Demo):</span>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    {INITIAL_USERS.map(u => (
                      <button
                        key={u.id}
                        onClick={() => switchUser(u.id)}
                        className={`p-3 rounded-xl border text-left text-xs ${currentUser.id === u.id ? 'border-indigo-600 bg-indigo-50 font-bold' : 'border-slate-200'}`}
                      >
                        <span className="block font-bold">{u.name.split(' ')[0]}</span>
                        <span className="block text-[10px] text-slate-500 capitalize">{u.role}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {page === 'auth' && (
              <div className="max-w-md mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-xl space-y-5">
                <div className="text-center">
                  <h2 className="text-xl font-black text-slate-900">Campus Sign In UI</h2>
                  <p className="text-xs text-slate-500 mt-0.5">Frontend mock authentication interface</p>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => { setRole('driver'); showToast('Role set to Driver'); }} className={`py-2 rounded-xl text-xs font-bold border ${role === 'driver' ? 'bg-indigo-50 border-indigo-600 text-indigo-700' : 'border-slate-200'}`}>
                    🚗 Driver
                  </button>
                  <button onClick={() => { setRole('passenger'); showToast('Role set to Passenger'); }} className={`py-2 rounded-xl text-xs font-bold border ${role === 'passenger' ? 'bg-indigo-50 border-indigo-600 text-indigo-700' : 'border-slate-200'}`}>
                    👥 Passenger
                  </button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-600 mb-1">College Email</label>
                    <input type="email" defaultValue="student@college.edu" className="w-full p-2.5 border border-slate-200 rounded-xl" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-600 mb-1">Password</label>
                    <input type="password" defaultValue="••••••••" className="w-full p-2.5 border border-slate-200 rounded-xl" />
                  </div>
                  <button onClick={() => { showToast('Signed in successfully!'); setPage('dashboard'); }} className="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md">
                    Sign In as {role.toUpperCase()}
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Global Footer */}
          <footer className="bg-slate-950 text-slate-400 py-6 border-t border-slate-800 text-center text-xs">
            <p className="font-semibold text-slate-300">Smart Carpool & Dynamic Route Matching System</p>
            <p className="text-[11px] text-slate-500 mt-1">College CSE Final Year Project • React + Tailwind CSS UI Prototype</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
